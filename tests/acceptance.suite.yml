bootstrap: _bootstrap.php
step_decorators:
    - \Codeception\Step\TryTo
class_name: AcceptanceTester
modules:
    enabled:
        - Asserts
        - WebDriver:
              url: https://tages.ru/
              port: 4444
              browser: chrome
              window_size: 1920x1200
              capabilities:
                  acceptInsecureCerts: true
                  chromeOptions:
                      args: ["--disable-gpu", "--window-size=1920,1200"] #  Run Chrome in headless mode "--headless", "--disable-web-security",